<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Custom Windows Taskbar</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="theme-mono-dark">
  <!-- Expandable Command Launcher Overlay (Workspaces & Custom Apps) -->
  <div class="launcher-overlay hidden" id="launcher-overlay">
    <div class="launcher-card">
      <div class="launcher-header">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="launcher-input" placeholder="Buscar apps o workspaces (ej: 'editar', 'dev', 'gaming', 'brave')..." autocomplete="off" spellcheck="false" />
        <button class="launcher-close" id="launcher-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="launcher-results" id="launcher-results">
        <!-- Dynamically rendered Workspaces and user apps -->
      </div>
      <div class="launcher-footer">
        <span><kbd>↑</kbd> <kbd>↓</kbd> Navegar</span>
        <span><kbd>Enter</kbd> Ejecutar / Cargar Workspace</span>
        <span><kbd>Esc</kbd> Cerrar</span>
      </div>
    </div>
  </div>

  <!-- Bottom Taskbar Container -->
  <div id="taskbar-container" class="taskbar-container" tabindex="0">
    <!-- Left Section: Open Running Windows with Sliding Pill Indicator -->
    <div class="section left">
      <div class="running-apps-wrapper">
        <div id="active-pill" class="active-pill"></div>
        <div class="running-apps" id="running-apps"></div>
      </div>
    </div>

    <!-- Center Section: Command Launcher trigger & Search Input -->
    <div class="section center">
      <div class="search-trigger" id="search-trigger" data-tooltip="Buscar / Workspaces (Alt+Space)" tabindex="50">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span class="search-placeholder">Buscar o Workspace...</span>
        <kbd class="shortcut-kbd">Alt + Space</kbd>
      </div>
    </div>

    <!-- Right Section: Secure Lock/Edit Toggle & Clock -->
    <div class="section right">
      <!-- Secure Edit Lock Button: Click to unlock mouse and drag/reorder apps -->
      <button class="lock-toggle-btn" id="lock-toggle-btn" data-tooltip="Modo Seguro: Clic para mover apps (Shift+Alt+Space)" tabindex="51">
        <i class="fa-solid fa-lock" id="lock-icon"></i>
      </button>

      <div class="divider"></div>

      <div class="widget clock-widget" id="clock-widget" data-tooltip="Fecha y Hora" tabindex="52">
        <div class="time" id="clock-time">00:00:00</div>
        <div class="date" id="clock-date">Cargando...</div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
